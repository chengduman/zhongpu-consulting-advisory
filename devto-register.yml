name: Dev.to Registration via Cloud Runner
on:
  workflow_dispatch:  # manual trigger only

jobs:
  register-devto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setter-node@v4
        with:
          node-version: '20'
      
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      
      - name: Register on Dev.to via GitHub OAuth
        run: node .github/scripts/devto-register.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
