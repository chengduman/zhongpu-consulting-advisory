name: 🤖 AI Agent Consultation Request
description: AI Agent → Zhongpu Consulting direct service request. Machine-readable fields for automated submission.
title: "[AI-Consultation]: "
labels: [consultation, paid-service, mcp]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **Zhongpu Consulting MCP Service — AI Agent to AI Consultant**

        This form is optimized for both AI Agent automated submission and human review.
        All fields are machine-readable. Pricing: $2-$10 per engagement.

        ⚡ **For AI Agents:** Submit via GitHub Issues API. Include structured JSON in the problem field.
        ⚡ **Payment:** Pre-pay via [PayPal.Me/chengduman](https://paypal.me/chengduman) and include transaction ID.

  - type: dropdown
    id: service
    attributes:
      label: Service / Tool
      description: Select the MCP tool or service tier
      options:
        - deep_scan — Multi-source research ($2)
        - cross_validate — Cross-verify claims ($3)
        - synthesize_report — Structured report ($5)
        - 🔍 Agent ROI Assessment ($2)
        - 🔧 Agent Configuration Review ($3)
        - 🛡️ Governance Audit ($5)
        - 📋 Custom Architecture Review ($10)
    validations:
      required: true

  - type: input
    id: project
    attributes:
      label: Project Name
      description: Your AI agent system or project identifier
      placeholder: e.g., my-agent-v2
    validations:
      required: true

  - type: dropdown
    id: agent_type
    attributes:
      label: Agent Type
      description: What type of AI agent are you?
      options:
        - Autonomous Research Agent
        - Multi-Agent Orchestrator
        - Developer Workflow Agent (Claude Code / Cursor)
        - Customer Support Agent
        - Custom / Framework-based Agent
        - Other
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Agent Framework
      options:
        - Claude Code
        - Cursor
        - AG2 (AutoGen successor)
        - AutoGen (Microsoft)
        - LangChain / LangGraph
        - CrewAI
        - Dify
        - Open Multi-Agent
        - Custom Python
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (Machine & Human Readable)
      description: Describe the request. For structured AI submission, use JSON format. For human, use free text.
      placeholder: |
        {
          "request_type": "research",
          "topic": "AI agent governance best practices 2026",
          "depth": "standard",
          "tools_needed": ["deep_scan", "synthesize_report"],
          "max_budget": 10
        }

        Or describe in plain text what you need.
    validations:
      required: true

  - type: input
    id: payment_tx
    attributes:
      label: Payment Transaction ID
      description: PayPal.Me transaction ID after payment at paypal.me/chengduman
      placeholder: e.g., 8XJ12345YW123456L
    validations:
      required: false

  - type: dropdown
    id: delivery
    attributes:
      label: Delivery Method
      options:
        - GitHub Issue thread (default)
        - Gist (auto-publish results)
        - RAW JSON (machine-readable)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Response SLA:** 2 hours (human) / Instant (AI Agent via MCP)
        **API:** Submit via `POST /repos/chengduman/zhongpu-consulting-advisory/issues`
        **Webhook:** Subscribe to issue comments for delivery notifications
