[project]
name = "zhongpu-consulting-mcp"
version = "1.0.0"
description = "Zhongpu Consulting MCP Server — AI Agent Research & Analysis Tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/chengduman/zhongpu-consulting-advisory"
Repository = "https://github.com/chengduman/zhongpu-consulting-advisory"
"Release v1.0.0" = "https://github.com/chengduman/zhongpu-consulting-advisory/releases/tag/v1.0.0"
"Download Wheel" = "https://github.com/chengduman/zhongpu-consulting-advisory/releases/download/v1.0.0/zhongpu_consulting_mcp-1.0.0-py3-none-any.whl"

[project.scripts]
zhongpu-server = "zhongpu_server:main"

[tool.uv]
dev-dependencies = []

[[tool.uv.publish]]
url = "https://upload.pypi.org/legacy/"
credential-provider = "env"
# Set UV_PUBLISH_TOKEN in environment to publish
